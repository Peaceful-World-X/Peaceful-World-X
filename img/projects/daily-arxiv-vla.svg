  <title id="daily-title">Daily ArXiv VLA — a searchable paper feed</title>
  <desc id="daily-desc">Search VLA papers through daily cards with Chinese summaries. A decorative radar surrounds paper cards, not measured activity. The entire card links to the live project.</desc>
