    <path d="m886 169 13 7v15l-13 7-13-7v-15Z" fill="#56d4dd" fill-opacity=".1" stroke="#56d4dd" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="m873 176 13 7 13-7m-13 7v15" stroke="#56d4dd" stroke-width="1.2"/>
  </g>
  <path d="M707 31V22H718M965 123H974V114" stroke="#56d4dd" stroke-opacity=".5" stroke-width="1.2"/>
</svg>
