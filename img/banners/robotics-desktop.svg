<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="155" viewBox="0 0 1000 155" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Peaceful-World-X — Wenyao · Embodied AI</title>
  <desc id="desc">Making intelligence act in the real world. Vision plus language leads to action. Research interests: VLA, WAM, and RL. An articulated robot arm reaches for a cyan object inside a softly animated lavender orbit.</desc>
  <defs>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(840 77) scale(145 72)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#56d4dd" stop-opacity=".13"/>
      <stop offset="1" stop-color="#56d4dd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="710" y1="80" x2="819" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#344754"/>
      <stop offset=".48" stop-color="#20303d"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="edge" x1="28" y1="1" x2="640" y2="1" gradientUnits="userSpaceOnUse">
      <stop stop-color="#56d4dd"/>
      <stop offset="1" stop-color="#56d4dd" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" stroke="#30363d" stroke-opacity=".3" stroke-width=".7"/>
    </pattern>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
      .wire-signal { animation: wire 9s linear infinite; }
      .orbit-signal { animation: orbit 32s linear infinite; }
      .object-halo { animation: breathe 5s ease-in-out infinite; }
      @keyframes wire { to { stroke-dashoffset: -160; } }
      @keyframes orbit { to { stroke-dashoffset: -600; } }
      @keyframes breathe { 0%, 100% { opacity: .35; } 50% { opacity: .7; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
    </style>
  </defs>

  <rect x=".5" y=".5" width="999" height="154" rx="13" fill="#0d1117" stroke="#30363d"/>
  <path d="M28 1H640" stroke="url(#edge)" stroke-width="2"/>
  <rect x="695" y="13" width="291" height="129" rx="9" fill="url(#grid)"/>
  <ellipse cx="840" cy="77" rx="145" ry="72" fill="url(#halo)"/>

  <text x="28" y="28" class="mono" font-size="13" letter-spacing="1.5" fill="#56d4dd">WENYAO / EMBODIED AI</text>
  <text x="26" y="74" class="sans" font-size="46" font-weight="750" letter-spacing="-1.8" fill="#e6edf3">Peaceful-World-X</text>
  <text x="28" y="99" class="sans" font-size="17" fill="#9aaabc">Making intelligence act in the real world.</text>

  <!-- One low-profile terminal line replaces the stacked badge rows. -->
  <rect x="28" y="113" width="613" height="26" rx="6" fill="#161b22" stroke="#30363d"/>
  <path d="m40 122 4 4-4 4" stroke="#56d4dd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="55" y="131" class="mono" font-size="14" fill="#e6edf3">vision + language <tspan fill="#56d4dd">→ action</tspan></text>
  <path d="M481 119V133" stroke="#30363d"/>
  <text x="498" y="131" class="mono" font-size="13" fill="#9aaabc"><tspan fill="#56d4dd">VLA</tspan> / WAM / <tspan fill="#a5a0ff">RL</tspan></text>
  <path d="M641 126H685Q697 126 697 132H793" stroke="#30363d" stroke-width="1.2"/>
  <path class="wire-signal" d="M641 126H685Q697 126 697 132H793" stroke="#56d4dd" stroke-opacity=".65" stroke-width="1.2" stroke-dasharray="16 144"/>

  <!-- A wide, quiet orbit frames the original arm at a compact scale. -->
  <circle cx="837" cy="77" r="63" stroke="#30363d" stroke-dasharray="2 6"/>
  <path d="M837 10V16M837 138V144M770 77H776M898 77H904" stroke="#9aaabc" stroke-opacity=".5"/>
  <ellipse cx="840" cy="77" rx="132" ry="45" transform="rotate(-13 840 77)" stroke="#a5a0ff" stroke-opacity=".35"/>
  <ellipse class="orbit-signal" cx="840" cy="77" rx="132" ry="45" transform="rotate(-13 840 77)" stroke="#a5a0ff" stroke-width="1.5" stroke-dasharray="22 578"/>

