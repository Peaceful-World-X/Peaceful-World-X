    <circle cx="720" cy="147" r="3" fill="#e6edf3"/>
    <circle cx="804" cy="90" r="14" fill="#161b22" stroke="#56d4dd" stroke-width="2"/>
    <circle cx="804" cy="90" r="6" fill="#0d1117" stroke="#9aaabc" stroke-width="1.5"/>
    <circle cx="853" cy="129" r="10" fill="#161b22" stroke="#9aaabc" stroke-width="2"/>
    <circle cx="853" cy="129" r="3" fill="#56d4dd"/>
    <path d="m853 140 11-10 12 14-11 10Z" fill="#20303d" stroke="#56d4dd" stroke-width="1.5"/>
