<svg xmlns="http://www.w3.org/2000/svg" width="520" height="195" viewBox="0 0 520 195" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Peaceful-World-X — Wenyao · Embodied AI</title>
  <desc id="desc">Making intelligence act in the real world. Vision plus language leads to action. A compact articulated robot arm reaches for a cyan object within a softly animated lavender orbit.</desc>
  <defs>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(406 107) scale(92 78)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#56d4dd" stop-opacity=".15"/>
      <stop offset="1" stop-color="#56d4dd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="327" y1="179" x2="389" y2="299" gradientUnits="userSpaceOnUse">
      <stop stop-color="#344754"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
      .orbit-signal { animation: orbit 28s linear infinite; }
      .object-halo { animation: breathe 5s ease-in-out infinite; }
      @keyframes orbit { to { stroke-dashoffset: -560; } }
      @keyframes breathe { 0%, 100% { opacity: .35; } 50% { opacity: .7; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
    </style>
  </defs>

  <rect x=".5" y=".5" width="519" height="194" rx="13" fill="#0d1117" stroke="#30363d"/>
  <path d="M23 1H224" stroke="#56d4dd" stroke-width="2"/>
  <text x="23" y="28" class="mono" font-size="12" letter-spacing="1.1" fill="#56d4dd">WENYAO / EMBODIED AI</text>
  <text x="21" y="66" class="sans" font-size="34" font-weight="750" letter-spacing="-1.3" fill="#e6edf3">Peaceful-World-X</text>
  <text x="23" y="98" class="sans" font-size="17" fill="#9aaabc">Making intelligence act <tspan x="23" dy="23">in the real world.</tspan></text>

  <rect x="23" y="145" width="277" height="29" rx="6" fill="#161b22" stroke="#30363d"/>
  <path d="m34 155 4 4-4 4" stroke="#56d4dd" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="48" y="164" class="mono" font-size="14" fill="#e6edf3">vision + language <tspan fill="#56d4dd">→ action</tspan></text>

